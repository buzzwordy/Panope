{{- if and (eq .Values.auth.mode "oidc") (not .Values.auth.existingSessionSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "panope.fullname" . }}-auth
  labels: {{- include "panope.labels" . | nindent 4 }}
type: Opaque
stringData:
  clientSecret: {{ required "auth.oidc.clientSecret or auth.oidc.existingSecret is required for oidc mode" .Values.auth.oidc.clientSecret | quote }}
  sessionSecret: {{ required "auth.sessionSecret is required for oidc mode (openssl rand -hex 32)" .Values.auth.sessionSecret | quote }}
{{- end }}
